name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan GitHub surfaces for anonymization leaks
        env:
          ANONYMIZATION_GITHUB_REQUIRED: "1"
          ANONYMIZATION_BLOCKLIST_TERMS: ${{ secrets.ANONYMIZATION_BLOCKLIST_TERMS }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run anonymization-check:github

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2

      - name: Run full validation
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          npm run check
          npm run render-smoke

      - name: Package HACS asset
        run: |
          mkdir -p release
          cp dist/ha-unifi-drive-card.js release/ha-unifi-drive-card.js
          cp dist/ha-unifi-drive-card.js.map release/ha-unifi-drive-card.js.map
          (cd release && zip -r ha-unifi-drive-card.zip ha-unifi-drive-card.js ha-unifi-drive-card.js.map)

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ha-unifi-drive-card
          path: |
            release/ha-unifi-drive-card.js
            release/ha-unifi-drive-card.js.map
            release/ha-unifi-drive-card.zip

      - name: Publish GitHub release for tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: release-notes/${{ github.ref_name }}.md
          files: |
            release/ha-unifi-drive-card.js
            release/ha-unifi-drive-card.js.map
            release/ha-unifi-drive-card.zip
